<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#171b16" />
  <meta name="description" content="Cashual is a private, local-first money tracker for wallets, spending, bills, budgets, and goals." />
  <title>Cashual — Money, made casual</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="rail" aria-label="Primary navigation">
      <a class="brand" href="#home" aria-label="Cashual home"><span class="brand-mark">C</span><span>cashual</span></a>
      <nav id="desktopNav"></nav>
      <div class="rail-foot"><button class="privacy" id="themeBtn" aria-pressed="false"><span id="themeIcon"></span> Dark mode</button><button class="privacy" id="privacyBtn" aria-pressed="false"><span id="privacyIcon"></span> Hide balances</button><div class="profile"><span id="profileInitials">—</span><div><strong id="profileName">Your profile</strong><small>Local profile</small></div></div></div>
    </aside>

    <main>
      <header class="topbar"><div><p id="eyebrow">Sunday, September 20</p><h1 id="pageTitle">Good afternoon, Jamie.</h1></div><div class="top-actions"><button class="icon-btn" id="notifBtn" aria-label="Notifications"><svg viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9ZM10 21h4"/></svg><i></i></button><button class="primary-btn" data-quick><span>＋</span> Add</button></div></header>
      <div id="view" aria-live="polite"></div>
    </main>

    <nav class="mobile-nav" id="mobileNav" aria-label="Primary navigation"></nav>
    <button class="fab" data-quick aria-label="Open quick add"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
  </div>

  <dialog id="quickDialog" class="quick-dialog">
    <button class="close" data-close aria-label="Close">×</button>
    <p class="overline">Quick add</p><h2>What are we adding?</h2>
    <div class="quick-grid">
      <button data-kind="expense"><span class="quick-icon coral"><svg viewBox="0 0 24 24"><path d="M7 7h10v10M7 17 17 7"/></svg></span><strong>Expense</strong><small>Money you spent</small></button>
      <button data-kind="income"><span class="quick-icon lime"><svg viewBox="0 0 24 24"><path d="M17 7 7 17M7 7v10h10"/></svg></span><strong>Income</strong><small>Money received</small></button>
      <button data-kind="transfer"><span class="quick-icon blue"><svg viewBox="0 0 24 24"><path d="m7 7-3 3 3 3M4 10h15m-2 1 3 3-3 3M20 14H5"/></svg></span><strong>Transfer</strong><small>Between wallets</small></button>
      <button data-kind="bill"><span class="quick-icon yellow"><svg viewBox="0 0 24 24"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2V3Z"/><path d="M9 8h6M9 12h6"/></svg></span><strong>Bill</strong><small>Track a due date</small></button>
      <button data-kind="wallet"><span class="quick-icon purple"><svg viewBox="0 0 24 24"><path d="M3 6h15a3 3 0 0 1 3 3v9H3V6Z"/><path d="M3 6V4h14v2M16 11h5v4h-5a2 2 0 0 1 0-4Z"/></svg></span><strong>Wallet</strong><small>Add an account</small></button>
    </div>
  </dialog>

  <dialog id="formDialog" class="form-dialog"><form id="entryForm"><button class="close" type="button" data-close aria-label="Close">×</button><p class="overline" id="formOverline">New expense</p><h2 id="formTitle">Where did it go?</h2><div id="formFields"></div><div class="form-actions"><button type="button" class="ghost-btn" data-close>Cancel</button><button type="submit" class="primary-btn" id="saveBtn">Save expense</button></div></form></dialog>
  <dialog id="profileDialog" class="profile-dialog"><form id="profileForm"><div class="welcome-mark"><span>C</span></div><p class="overline" id="profileOverline">Welcome to Cashual</p><h2 id="profileTitle">Let’s make it yours.</h2><p class="dialog-copy">Your details stay on this device. Salary is optional and helps personalize your overview.</p><div class="form-grid"><div class="field full"><label for="userName">What should we call you?</label><input id="userName" name="userName" required autocomplete="name" placeholder="Your name"></div><div class="field full"><label for="monthlySalary">Monthly salary <small>(optional)</small></label><div class="money-input"><span>₱</span><input id="monthlySalary" name="monthlySalary" type="number" min="0" step=".01" placeholder="0.00"></div></div></div><div class="form-actions"><button type="button" class="ghost-btn" id="cancelProfile">Cancel</button><button type="submit" class="primary-btn">Save profile</button></div></form></dialog>
  <div id="toast" role="status"></div>
  <script src="app.js"></script>
</body>
</html>
